<!DOCTYPE html>
<html lang="es" xmlns="https://thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP-TAREAS</title>
  <style>
    .formulario {
      display: flex;
      justify-content: space-between;
      width: 60%;
      margin: 0 auto;
    }

    ul {
      width: 60%;
      margin: 0 auto;
    }

    li {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid black;
      padding: 5px;
    }

    .completar {
      text-decoration: line-through;
      color: #ccc;
    }

    .form-layout {
      display: flex;
      justify-content: space-between;
      width: 80%;
      margin: 10px auto;
    }

    @media print {
      .cabecera {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="cabecera">

    <h1 th:text="${titulo_de_la_pagina}"></h1>

    <hr>

    <div class="formulario">
      <form th:action="@{/guardar}" method="POST" th:object="${tarea}">
        <label for="descripcion">Descripción:</label>
        <input type="text" id="descripcion" th:field="*{descripcion}" placeholder="Ingresa la descripción" required>
        <input type="submit" value="Guardar">
      </form>

      <div>
        <button id="btn-pdf">GENERAR PDF</button>
      </div>
    </div>

    <hr>

  </div>

  <div class="detalle">

    <h2 style="text-align: center;">Listado de tareas</h2>

    <ul class="tasks-list">
      <li th:each="t : ${todas_las_tareas}">

        <span th:classappend="${t.completada} ? 'completar' : '' " th:text="${t.descripcion}"></span>

        <div>
          <form th:if="${t.completada} == false" th:action="@{/completar/{id}(id=${t.id})}" method="post">
            <input type="submit" value="✓" title="Completar">
          </form>
          <form th:if="${t.completada} == true" th:action="@{/eliminar/{id}(id=${t.id})}" method="post">
            <input type="submit" value="✕" title="Eliminar">
          </form>
        </div>
      </li>
    </ul>

  </div>

  <script>

    const btn = document.getElementById('btn-pdf');
    btn.addEventListener('click', crearPdf);

    function crearPdf() {
      window.print();
    }

  </script>

</body>

</html>
